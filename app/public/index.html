<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ShareBox File Sharing Platform</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <div class="container">

        <h1>ShareBox</h1>

        <p>Containerized File Sharing Platform</p>

        <div class="upload-box">

            <h2>Upload File</h2>

            <form id="uploadForm">

                <input
                    type="file"
                    id="fileInput"
                    name="file"
                    required
                >

                <button type="submit">
                    Upload
                </button>

            </form>

            <p id="message"></p>

        </div>

        <div class="files-box">

            <h2>Available Files</h2>

            <button onclick="loadFiles()">
                Refresh Files
            </button>

            <ul id="fileList"></ul>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
